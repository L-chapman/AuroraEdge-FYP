[project]
name = "northflux-security"
version = "3.2.0"
description = "Self-hosted email security assessment and remediation platform"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["src/app"]
omit = ["src/app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["docs", "reports", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
