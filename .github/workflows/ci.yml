name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term-missing
      - name: Run offline smoke test
        run: python verify_system.py --offline

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax and undefined names
        run: ruff check .
      - name: Security static analysis
        run: bandit -q -r src/app -lll
      - name: Audit declared dependencies
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test inside container image
        run: docker build --target test --tag northflux-security:test .
      - name: Build production container image
        run: docker build --target production --tag northflux-security:ci .
